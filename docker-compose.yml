version: '3.8'

services:

  # ── PostgreSQL — Data Warehouse ──────────────────────────────
  postgres:
    image: postgres:16
    container_name: sneakerz_postgres
    environment:
      POSTGRES_DB: sneakerz
      POSTGRES_USER: sneakerz_user
      POSTGRES_PASSWORD: sneakerz123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sneakerz_network

  # ── MinIO — Data Lake ─────────────────────────────────────────
  minio:
    image: minio/minio
    container_name: sneakerz_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sneakerz_network

  # ── Kafka + Zookeeper — Streaming ─────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: sneakerz_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - sneakerz_network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: sneakerz_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - sneakerz_network

  # ── Redis — Cache déduplication ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sneakerz_redis
    ports:
      - "6379:6379"
    networks:
      - sneakerz_network

  # ── FastAPI — Backend ─────────────────────────────────────────
  backend:
    build: ./backend
    container_name: sneakerz_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sneakerz_user:sneakerz123@postgres:5432/sneakerz
      MINIO_URL: http://minio:9000
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - minio
      - redis
    volumes:
      - ./backend:/app
    networks:
      - sneakerz_network

  # ── React — Frontend ──────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: sneakerz_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - sneakerz_network

volumes:
  postgres_data:
  minio_data:

networks:
  sneakerz_network:
    driver: bridge